<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KaamKaro — Under Maintenance</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fbff;color:#06142f;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
    .card{background:#fff;border-radius:24px;border:1px solid #e2e8f0;box-shadow:0 12px 40px rgba(6,20,47,.08);padding:48px 40px;max-width:480px;width:100%;text-align:center}
    .logo{font-size:28px;font-weight:900;margin-bottom:32px}.logo span{color:#08a63f}
    .icon{font-size:56px;margin-bottom:20px}
    h1{font-size:26px;font-weight:900;margin-bottom:12px}
    p{font-size:15px;color:#667085;line-height:1.6;margin-bottom:32px}
    .badge{display:inline-flex;align-items:center;gap:8px;background:#eaf8ef;border:1px solid rgba(8,166,63,.3);border-radius:999px;padding:8px 18px;font-size:13px;font-weight:700;color:#057a31}
    .dot{width:8px;height:8px;border-radius:50%;background:#08a63f;animation:pulse 1.5s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .footer{margin-top:40px;font-size:12px;color:#94a3b8}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Kaam<span>Karo</span></div>
    <div class="icon">🔧</div>
    <h1>We'll be back soon</h1>
    <p>We're making KaamKaro better for job seekers and employers across India. Our team is working hard — we'll be back shortly.</p>
    <div class="badge"><div class="dot"></div> Back very soon</div>
  </div>
  <div class="footer">KaamKaro · Made in India 🇮🇳</div>
</body>
</html>
